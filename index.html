<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a1017">
<meta name="description" content="从十种现实制度组合出发，逐年推演政策对经济与治理的影响。">
<title>经纬推演 · 政治经济模拟器</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%230e1b23'/%3E%3Cg fill='none' stroke='%2377e5c0' stroke-width='2'%3E%3Ccircle cx='20' cy='20' r='14'/%3E%3Cellipse cx='20' cy='20' rx='6' ry='14' transform='rotate(32 20 20)'/%3E%3Cpath d='M7 15l26 10M8 25l21-15'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="atlas.css">
<script defer src="engine.js"></script><script defer src="models.js"></script><script defer src="atlas.js"></script><script defer src="app.js"></script>
</head>
<body>
<header class="topbar"><div class="topinner">
<a class="brand" href="#workbench" aria-label="经纬推演工作台">
<svg class="brandmark" viewBox="0 0 44 44" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="22" cy="22" r="15.5"/><ellipse cx="22" cy="22" rx="7.5" ry="15.5" transform="rotate(32 22 22)"/><ellipse cx="22" cy="22" rx="15.5" ry="6.3" transform="rotate(32 22 22)"/><path d="M3 29C2 24 10 16 22 11s20-4 19 0c-.7 3-3.3 6-7 9"/></g></svg>
<span class="brandname">经纬推演<span>POLISCOPE</span></span></a>
<nav class="mainnav" aria-label="主导航">
<a href="#workbench" data-page="workbench"><i data-icon="dashboard"></i>推演工作台</a>
<a href="#atlas" data-page="atlas"><i data-icon="layers"></i>制度图谱</a>
<a href="#methods" data-page="methods"><i data-icon="book"></i>模型说明</a>
</nav><span class="save-state" id="save-state"></span></div></header>
<main id="main">
<section id="bench">
<div class="page-heading"><div><h1>政策推演工作台</h1><p>从现实制度出发，观察每一步政策如何影响经济与治理。</p></div>
<div class="round-controls"><span class="year-badge" id="year-badge"></span><button class="secondary small" id="reset"><i data-icon="reset"></i>重置推演</button></div></div>
<div class="workspace">
<aside class="controls">
<section class="model-card" id="model-card">
<div class="model-tint"></div>
<div class="model-card-top"><span class="model-tag"><i data-icon="globe"></i>当前制度模型</span><button id="change-model" class="frost"><i data-icon="switch"></i>切换</button></div>
<div class="model-copy"><div class="country-code" id="country-code"></div><h2 id="model-name"></h2><p id="model-sub"></p></div>
<button id="model-detail" class="model-detail"><i data-icon="book"></i>查看制度简介</button>
</section>
<section class="panel policy-panel"><div class="title-row"><i class="heading-icon" data-icon="sliders"></i><h2>政策控制台</h2></div>
<div class="field-line"><label>年度政策</label><button id="neutral-policy" class="neutral-option" data-policy="neutral" aria-pressed="false">维持现状</button></div>
<div id="policy-options" class="policy-options" role="group" aria-label="年度政策"></div>
<div class="field-line"><label id="intensity-label">实施力度</label><span id="intensity-value"></span></div>
<div class="seg" id="intensities" role="group" aria-labelledby="intensity-label"></div>
<div class="field-line"><label for="environment">外部环境</label></div>
<div class="select-wrap env-select"><i data-icon="globe"></i><select id="environment"><option value="base">基准外需</option><option value="strong">外需走强</option><option value="weak">外需走弱</option></select><i class="chev" data-icon="down"></i></div>
<button id="advance" class="primary"><i data-icon="play"></i>执行政策并推进一年</button>
</section></aside>
<div class="analysis">
<section class="panel trend-panel">
<div class="chart-heading"><div><div class="title-row"><i class="heading-icon" data-icon="trend"></i><h2>发展趋势预览</h2></div><p class="subhead" id="projection-sub"></p></div>
<div class="select-wrap horizon"><i data-icon="calendar"></i><select id="horizon" aria-label="趋势预览年数"><option value="5">未来 5 年</option><option value="10">未来 10 年</option><option value="3">未来 3 年</option></select><i class="chev" data-icon="down"></i></div></div>
<div class="plot-legend" id="legend"></div>
<div class="chart-area" id="chart-area"><svg id="plot" role="img" aria-label="未来实际产出、消费价格及公众信任的趋势图"></svg><div id="plot-tip" hidden></div></div>
<div class="chart-foot"><span><i data-icon="info"></i>指数以模拟起点为 100</span><span id="chart-label">教学情景 · 假设参数</span></div>
</section>
<section aria-labelledby="indicators-title" class="indicator-section"><div class="section-line"><h2 id="indicators-title">下一年指标</h2><span id="indicator-period"></span></div><div id="kpis" class="kpi-grid"></div></section>
<section class="panel report-panel">
<div class="report-tabs" role="group" aria-label="分析视图"><button data-report="effect"><i data-icon="activity"></i>政策影响</button><button data-report="history"><i data-icon="history"></i>决策记录 <span id="history-count"></span></button></div>
<div id="report-body"></div>
</section></div></div>
</section>
<section id="other-page" hidden></section>
</main>
<footer><span class="footer-name"><i data-icon="globe"></i>经纬推演 <b>POLISCOPE</b></span><span>教学用情景模拟 · 参数与起点均为假设值</span></footer>
<dialog id="reset-dialog"><form method="dialog"><h2>重置当前制度的推演？</h2><p id="reset-copy"></p><div class="dialog-actions"><button class="secondary" value="cancel">取消</button><button class="primary" value="reset">确认重置</button></div></form></dialog>
<div class="sr-only" role="status" aria-live="polite" id="announce"></div>
</body></html>
